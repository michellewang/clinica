---
name: Create/update Boutiques descriptors

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:

  create-descriptor:

    strategy:
      fail-fast: false
      matrix:
        include:
            - tool-name: adni-to-bids
              parser-location: clinica.converters.adni_to_bids.cli:cli
            - tool-name: aibl-to-bids
              parser-location: clinica.converters.aibl_to_bids.cli:cli
            - tool-name: habs-to-bids
              parser-location: clinica.converters.habs_to_bids.cli:cli
            - tool-name: nifd-to-bids
              parser-location: clinica.converters.nifd_to_bids.cli:cli
            - tool-name: oasis-to-bids
              parser-location: clinica.converters.oasis_to_bids.cli:cli
            - tool-name: oasis3-to-bids
              parser-location: clinica.converters.oasis3_to_bids.cli:cli
            - tool-name: ukb-to-bids
              parser-location: clinica.converters.ukb_to_bids.cli:cli
            - tool-name: genfi-to-bids
              parser-location: clinica.converters.genfi_to_bids.cli:cli
            - tool-name: ixi-to-bids
              parser-location: clinica.converters.ixi_to_bids.cli:cli
            - tool-name: t1-linear
              parser-location: clinica.pipelines.t1_linear.t1_linear_cli:cli
            - tool-name: flair-linear
              parser-location: clinica.pipelines.t1_linear.flair_linear_cli:cli
            - tool-name: pet-linear
              parser-location: clinica.pipelines.pet.linear.cli:cli
            - tool-name: t1-volume
              parser-location: clinica.pipelines.t1_volume.t1_volume_cli:cli
            - tool-name: pet-volume
              parser-location: clinica.pipelines.pet.volume.cli:cli
            - tool-name: statistics-volume
              parser-location: clinica.pipelines.statistics_volume.statistics_volume_cli:cli
            - tool-name: t1-freesurfer
              parser-location: clinica.pipelines.anatomical.freesurfer.t1.cli:cli
              updates: ', "inputs[2].command-line-flag-separator": "="'  # recon-all-args
            - tool-name: t1-freesurfer-longitudinal
              parser-location: clinica.pipelines.anatomical.freesurfer.longitudinal.cli:cli
            - tool-name: pet-surface
              parser-location: clinica.pipelines.pet_surface.pet_surface_cli:cli
            - tool-name: statistics-surface
              parser-location: clinica.pipelines.statistics_surface.cli:cli
            - tool-name: dwi-preprocessing-using-t1
              parser-location: clinica.pipelines.dwi.preprocessing.t1.cli:cli
            - tool-name: dwi-preprocessing-using-phasediff-fmap
              parser-location: clinica.pipelines.dwi.preprocessing.fmap.cli:cli
            - tool-name: dwi-dti
              parser-location: clinica.pipelines.dwi.dti.cli:cli
            - tool-name: dwi-connectome
              parser-location: clinica.pipelines.dwi.connectome.cli:cli

    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: 3.13

    - name: Install package
      run: |
        pip install -U pip
        pip install .

    - name: Create descriptor
      uses: styx-api/python-cli-to-boutiques@v1
      with:
        parser-type: click
        parser-location: ${{ matrix.parser-location }}
        output-path: descriptors/${{ matrix.tool-name }}.json
        token: ${{ secrets.PAT }}
        click-prog-name: clinica
        click-parent-location: clinica.cmdline:cli
        updates-str: '{ "name": "clinica-${{ matrix.tool-name }}" ${{ matrix.updates }} }'
